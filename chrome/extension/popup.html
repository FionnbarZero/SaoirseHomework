<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Homework Guardian</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <p class="eyebrow">FIONNBAR HOMEWORK</p>
      <h1>Chrome Guardian</h1>
      <div class="status"><span id="dot"></span><strong id="mode">Checking…</strong></div>
      <p id="detail">Contacting the local homework service.</p>
      <dl>
        <div><dt>Policy</dt><dd id="policy">—</dd></div>
        <div><dt>Last check</dt><dd id="checked">—</dd></div>
      </dl>
      <button id="refresh" type="button">Check now</button>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
