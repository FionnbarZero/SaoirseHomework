<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self' http://127.0.0.1:*" />
    <title>Reading Strategies Verification Simulator</title>
    <link rel="stylesheet" href="/reading-game-simulator.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="game-header">
        <div class="brand-mark">RS</div>
        <div>
          <p>LOCAL PROTOTYPE</p>
          <h1>Reading Strategies</h1>
        </div>
        <span id="day-badge" class="day-badge">Today</span>
      </header>

      <section id="game-card" class="game-card" aria-live="polite">
        <div class="progress-row">
          <span id="step-label">Question 1 of 3</span>
          <span class="progress-track"><span id="progress-bar"></span></span>
        </div>
        <p class="strategy-label">TRY THE STRATEGY</p>
        <h2 id="question-title">Read the short passage carefully.</h2>
        <blockquote id="passage"></blockquote>
        <div id="answers" class="answers"></div>
        <button id="next-button" class="next-button" disabled>Check answer</button>
        <p id="feedback" class="feedback"></p>
      </section>

      <section id="result-card" class="result-card" hidden aria-live="polite">
        <div id="result-icon" class="result-icon">✓</div>
        <p id="result-label" class="result-label">ROUND COMPLETE</p>
        <h2 id="result-title">Sending your verified result…</h2>
        <p id="result-copy">Keep this window open for a moment.</p>
        <button id="close-button" class="close-button" hidden>Close game</button>
      </section>

      <footer>
        This simulator tests secure completion only. It will be replaced by the real reading game.
      </footer>
    </main>
    <script src="/reading-game-simulator.js"></script>
  </body>
</html>
